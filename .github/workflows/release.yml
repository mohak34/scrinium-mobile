# Pushing a tag like v0.3.0 builds a signed release APK and publishes it as a
# GitHub release. The app's updater reads the latest release from here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: versionCode is the commit count

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          API_URL: ${{ vars.SCRINIUM_API_URL }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "scriniumGoogleClientId=$GOOGLE_CLIENT_ID"
            echo "scriniumApiUrl=$API_URL"
          } > keystore.properties

      - name: Build
        run: |
          ./gradlew assembleRelease \
            -PscriniumVersionName="${GITHUB_REF_NAME#v}" \
            -PscriniumVersionCode="$(git rev-list --count HEAD)" \
            -PscriniumUpdateRepo="$GITHUB_REPOSITORY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk "scrinium-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "scrinium-$GITHUB_REF_NAME.apk" --generate-notes
